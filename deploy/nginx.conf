# IP Architect derrière Nginx (installé par deploy/install.sh ; @DOMAIN@ et @PORT@ sont remplacés).
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # les imports CSV et les sauvegardes peuvent être volumineux (l'application limite à 12 Mo)
    client_max_body_size 13m;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # écrase tout en-tête envoyé par le client
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                          # scans et découvertes SNMP
    }
}
