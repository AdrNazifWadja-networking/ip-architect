# Démarrage : docker compose up -d --build   puis   http://localhost:3000
# Les données (base SQLite) vivent dans le volume « ipa-data » : elles survivent aux mises à jour de l'image.
services:
  ip-architect:
    build: .
    image: ip-architect
    ports:
      - "3000:3000"
    volumes:
      - ipa-data:/data
    restart: unless-stopped
    # Scan réseau et topologie : en réseau « bridge » (défaut), le conteneur ne voit pas les adresses MAC de votre réseau local.
    # Pour un scan complet, remplacez « ports » par :  network_mode: host   (Linux uniquement)
volumes:
  ipa-data:
